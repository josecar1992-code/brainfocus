# Todo el proyecto corre en contenedores — nada se instala directo en el host.
# `api` es el servicio persistente (arranca con `docker compose up -d api`).
# `mcp` no es un servicio de larga duración: OpenClaw lo invoca bajo demanda por
# stdio (`docker compose run --rm -T mcp`), por eso vive en el profile "tools"
# y no se levanta con `docker compose up`.

services:
  api:
    build: ./apps/api
    restart: unless-stopped
    env_file: ./apps/api/.env
    # OpenClaw corre nativo por systemd en el host (no en Docker), así que
    # 127.0.0.1 dentro de este contenedor nunca llega a su gateway — hay que
    # resolver la IP real del host. El aislamiento lo da un ufw allow acotado
    # a la subred de este stack (ver docker network inspect brainfocus_default).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Sin 127.0.0.1: el contenedor de Caddy (Natural Beauty) le llega por
      # host.docker.internal, que resuelve al gateway del bridge de Docker
      # (172.17.0.1), no a loopback. El aislamiento real lo da ufw (solo
      # 172.17.0.0/16 y 172.18.0.0/16 pueden entrar a este puerto).
      - "3001:3001"

  web:
    build:
      context: ./apps/web
      args:
        # Vite hornea esto en build time; docker compose los toma del .env en la
        # raíz del repo (no de apps/web/.env, que es solo para `npm run dev` local)
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    ports:
      - "8081:80" # ver nota de ufw arriba, mismo motivo

  mcp:
    build: ./apps/mcp
    profiles: ["tools"]
    network_mode: host
    env_file: ./apps/mcp/.env
    # guardar_documento lee el archivo por su MediaPath (ruta absoluta que
    # OpenClaw ya dejó en disco, en el host — OpenClaw corre nativo, no en
    # Docker). Este contenedor necesita ver esa misma ruta para poder leerla
    # con fs.readFile. Confirmado en el VPS: directorio real de media de
    # OpenClaw es /root/.openclaw/media.
    volumes:
      - /root/.openclaw/media:/root/.openclaw/media:ro
